name: Kostroma Events Scraper for Etazhi

on:
  # Запуск каждый день в 06:00 UTC (это 09:00 по московскому времени)
  schedule:
    - cron: '0 6 * * *'
  
  # Возможность запустить вручную в любой момент (оставляем для удобства)
  workflow_dispatch:

jobs:
  parse-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install gspread requests

      - name: Run Scraper
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scraper.py
